{% extends 'base.html' %}

{% block content %}
<h2 class="subtitle">Editar Planta</h2>

<form method="POST">
    <div class="field">
        <label class="label">Nombre</label>
        <div class="control">
            <input class="input" type="text" name="name" value="{{ plant[1] }}" required>
        </div>
    </div>

    <div class="field">
        <label class="label">Frecuencia de Riego</label>
        <div class="control">
            <input class="input" type="text" name="watering_frequency" value="{{ plant[2] }}" required>
        </div>
    </div>

    <div class="field">
        <label class="label">Tipo de Planta</label>
        <div class="control">
            <input class="input" type="text" name="plant_type" value="{{ plant[3] }}" required>
        </div>
    </div>

    <div class="field">
        <div class="control">
            <button class="button is-primary">Actualizar</button>
        </div>
    </div>
</form>

<a href="{{ url_for('index') }}" class="button is-link">Volver</a>
{% endblock %}
